<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture ideas before they disappear.</p>
  </header>

  <main>
    <section aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your notes</h2>

      <button id="load-btn" type="button">Load notes</button>

      <p id="status" role="status" aria-live="polite">
        Click "Load notes" to get started.
      </p>

      <form id="note-form">
        <h3>Create a note</h3>

        <label for="title-input">Title</label>
        <input
          id="title-input"
          name="title"
          type="text"
          required
        >

        <label for="body-input">Note body (optional)</label>
        <textarea
          id="body-input"
          name="body"
          rows="4"
        ></textarea>

        <button id="submit-btn" type="submit">Create note</button>
      </form>

      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes</p>
  </footer>
</body>
</html>
